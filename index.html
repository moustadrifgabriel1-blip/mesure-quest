<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mesure Quest</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mesure Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg">
<style>
/* ===== Système de design v4 : sobre, natif, une seule couleur d'accent. Suit l'apparence du système. ===== */
:root{
 --bg:#F2F2F7;--card:#FFFFFF;--card2:#F4F4F8;--ink:#111114;--ink2:#6E6E78;--ink3:#A3A3AD;--line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.22);
 --accent:#0E8C89;--accent2:#0A6E6C;--on:#FFFFFF;--tint:rgba(14,140,137,.11);
 --ok:#1D9E5A;--okbg:rgba(29,158,90,.12);--bad:#E0464C;--badbg:rgba(224,70,76,.12);--gold:#F0A21B;--goldbg:rgba(240,162,27,.14);--fire:#FF6A2B;
 --fig:#111827;--field:#FFFFFF;
 --sh:0 1px 2px rgba(20,20,30,.05),0 6px 20px rgba(20,20,30,.05);
 --fb:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fd:var(--fb);--fm:var(--fb);
 --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
 /* anciens noms encore utilisés par le contenu */
 --panel:var(--card);--panel2:var(--card2);--muted:var(--ink2);--amber:var(--gold);--amber2:var(--gold);--cyan:var(--accent);--lock:var(--ink3);--w:var(--accent)}
@media(prefers-color-scheme:dark){:root{--bg:#000000;--card:#1C1C1E;--card2:#2A2A2E;--ink:#F2F2F5;--ink2:#9C9CA6;--ink3:#636370;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--accent:#2FBDB9;--accent2:#6ED8D5;--tint:rgba(47,189,185,.17);--ok:#3DCB7A;--okbg:rgba(61,203,122,.16);--bad:#FF6166;--badbg:rgba(255,97,102,.16);--gold:#FFB83D;--goldbg:rgba(255,184,61,.16);--field:#2A2A2E;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em;text-wrap:balance;font-weight:700}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
a{color:var(--accent)}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:none}
#app{max-width:600px;margin:0 auto;padding:calc(8px + var(--sat)) 16px calc(96px + var(--sab))}
/* bandeau d'état */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px;min-height:42px}
.xp{flex:1;min-width:0}.xp .lbl{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;min-width:0}.xp .lbl span{overflow:hidden;text-overflow:ellipsis}.xp .lbl span:first-child{color:var(--ink);flex:none}
.xp .bar,.ebar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.xp .bar i,.ebar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--card);border-radius:999px;padding:6px 11px 6px 9px;white-space:nowrap;color:var(--ink);box-shadow:var(--sh)}
.pill .ic{width:16px;height:16px;color:var(--gold)}.pill.fire .ic{color:var(--ink3)}.pill.fire.lit .ic{color:var(--fire)}
/* titres */
.hero{margin:6px 0 16px}.hero h1{font-size:30px}.hero p{color:var(--ink2);margin:6px 0 0;font-size:15px;line-height:1.45}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.sec{font-size:20px;margin:24px 0 8px;display:flex;align-items:center;gap:8px}.cdot{width:10px;height:10px;border-radius:50%;flex:none}
.nb{display:flex;align-items:center;min-height:36px;margin:0 0 6px}.back{display:inline-flex;align-items:center;gap:1px;color:var(--accent);font-weight:600;font-size:16px;margin-left:-8px;padding:6px 10px 6px 4px;border-radius:10px}.back .ic{width:22px;height:22px}
/* cartes */
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{font-size:22px;margin-bottom:8px}
.slide p{margin:8px 0;font-size:16px;line-height:1.5}
.key{background:var(--tint);padding:12px 14px;margin:14px 0;border-radius:12px;line-height:1.5}.key b{color:var(--accent2)}
.tip{display:block;background:var(--card2);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:12px 0;color:var(--ink);line-height:1.45}#app>.tip{background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:14px 16px}
/* mondes */
.world{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin:10px 0;background:var(--card);border-radius:18px;box-shadow:var(--sh);transition:transform .15s,opacity .2s}
.world:active:not(:disabled){transform:scale(.985)}.world:disabled{opacity:.55}
.world .e{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;background:var(--tint);background:color-mix(in srgb,var(--w) 16%,transparent)}
.world:disabled .e{background:var(--line);color:var(--ink3)}.world .e .ic{width:22px;height:22px}
.world .t{font-size:17px;font-weight:600}.world .s{font-size:13px;color:var(--ink2);line-height:1.35;margin-top:1px}.world .num{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:1px}
.world .st{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}.world .st small{display:block;color:var(--ink3);font-size:11px;font-weight:500}
.world .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}.world .prog i{display:block;height:100%;background:var(--w);border-radius:2px}
/* parcours d'un monde */
.path{position:relative;padding-left:26px;margin-top:6px}.path:before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:var(--line2);border-radius:1px}
.node{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:14px 16px;margin:10px 0;background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.node:before{content:"";position:absolute;left:-23px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);transform:translateY(-50%)}
.node.done:before{background:var(--w);border-color:var(--w)}.node.cur:before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.node:disabled{opacity:.5}.node .t{font-weight:600;font-size:16px}.node .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}.node .num{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:1px}
.node.boss{background:var(--ink);color:var(--bg)}.node.boss .num,.node.boss .s{color:var(--bg);opacity:.7}
.tile{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px;background:var(--tint);font-size:24px;line-height:1;flex:none}.tile.sm{width:40px;height:40px;font-size:22px;border-radius:12px}.node.boss .tile{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}.tile .ic{width:22px;height:22px}
.stars{color:var(--gold);letter-spacing:1px;font-size:15px;font-weight:600}.stars.off{color:var(--ink3)}
/* figures et laboratoires : toujours sur fond sombre, les schémas sont dessinés pour lui */
.fig{margin:12px 0;background:var(--fig);color:#E5E7EB;border-radius:12px;padding:10px;overflow-x:auto;--card:#0F172A;--card2:#1F2937;--ink:#E5E7EB;--ink2:#9CA3AF;--ink3:#6B7280;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--field:#0F172A;--muted:#9CA3AF;--gold:#FBBF24;--amber:#FBBF24;--amber2:#FCD34D;--tint:rgba(255,255,255,.08)}
.fig svg{display:block;width:100%;height:auto;max-height:230px}
.lab{display:grid;gap:12px}.lab label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}.lab label .mono{color:var(--ink);font-size:14px}
.lab input[type=range]{accent-color:var(--gold);width:100%}.lab select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.read div{background:var(--card2);border-radius:10px;padding:8px 10px}
.read small{display:block;font-size:11px;color:var(--ink2)}.read span{font-weight:600;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}.warn{color:var(--bad)!important;font-weight:600}
/* boutons */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;background:var(--accent);color:var(--on);border-radius:14px;padding:13px 18px;font-size:16px;min-height:50px;transition:transform .1s,opacity .2s;line-height:1.2}
.btn .ic{width:20px;height:20px}
.btn:active{transform:scale(.98)}.btn.ghost{background:var(--tint);color:var(--accent2)}.btn.cy{background:var(--accent);color:var(--on)}.btn.red{background:var(--badbg);color:var(--bad)}.btn.wide{width:100%}.btn:disabled{opacity:.4}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:11px}.btn.sm .ic{width:18px;height:18px}
.dots{display:flex;gap:6px;align-items:center}.dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .2s}.dots i.on{background:var(--accent);width:18px}
/* combat */
.arena{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.foe{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}.foe .e{width:48px;height:48px;border-radius:14px;background:var(--badbg);display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;transition:transform .15s}.foe.hit .e{animation:shake .4s}.foe.dead .e{opacity:.3;transform:rotate(90deg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.foe .n{font-weight:600;font-size:15px}.foe .n small{color:var(--ink2);font-weight:500;font-size:12px;margin-left:6px}
.hp{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.hp i{display:block;height:100%;background:var(--bad);border-radius:4px;transition:width .4s}.hp.boss i{background:var(--ink)}
.me{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hearts{display:inline-flex;gap:2px;color:var(--bad)}.hearts .ic{width:18px;height:18px}.hearts .lost{display:inline-flex;gap:2px;opacity:.2}
.combo{color:var(--accent);font-weight:600}
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 0}.timer i{display:block;height:100%;background:var(--bad);transition:width 1s linear}
.q{font-size:18px;font-weight:600;margin:4px 0 14px;line-height:1.4;letter-spacing:-.01em}
.opts{display:grid;gap:8px}.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.35;transition:transform .1s,background .15s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .k,.opt .n{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}.opt .n{color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--tint)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k,.opt.ok .n{background:var(--ok);color:#fff;box-shadow:none}.opt.ko{border-color:var(--bad);background:var(--badbg)}.opt.ko .k{background:var(--bad);color:#fff;box-shadow:none}.opt.paired{opacity:.35}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match .opt{font-size:13.5px;padding:11px 12px}
.numin{display:flex;gap:8px;align-items:center}
.numin input,.field{font:600 18px var(--fb);background:var(--field);color:var(--ink);border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;min-width:0;font-variant-numeric:tabular-nums}.numin input{flex:1}.field{width:100%}.field.mono{font-family:ui-monospace,Menlo,monospace}.numin .u{color:var(--ink2);font-weight:600}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:var(--badbg);font-size:15px;line-height:1.5;animation:pop .25s}.fb.ok{background:var(--okbg)}
.fb b{display:block;color:var(--bad);margin-bottom:4px;font-size:15px}.fb.ok b{color:var(--ok)}.fb b:empty{display:none}
.why{margin-top:10px;font-size:14px}.why summary{cursor:pointer;color:var(--accent2);font-weight:600;list-style:none;padding:6px 0;display:flex;align-items:center;gap:6px}.why summary::-webkit-details-marker{display:none}.why summary .ic{width:18px;height:18px}
.why-b{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--ink)}.why-b p{margin:6px 0;line-height:1.5}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}.frac>span{padding:1px 5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}.frac>span:first-child{border-bottom:1.5px solid currentColor}.sqrt{white-space:nowrap}.sqrt .rad{border-top:1.5px solid currentColor;padding:1px 2px 0 1px;margin-left:1px}sub,sup{font-size:.72em}.frac sup{position:relative;top:-.45em;line-height:0}.frac sub{position:relative;top:.3em;line-height:0}
.nl{margin:6px 0 10px;padding-left:1.6em}.nl li{margin:5px 0;padding-left:4px}.nl li::marker{color:var(--accent);font-weight:700}
.src{margin-top:10px;font-size:12.5px;color:var(--ink3)}.fbt{display:block;font-weight:700;color:var(--bad);margin-bottom:4px}.fbo{margin:0 0 10px 0;padding-left:22px}.fbo li{margin:5px 0;line-height:1.45}.fbo li::marker{color:var(--ink2);font-weight:700}.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:3px;line-height:1.4}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.dmg{position:fixed;left:50%;top:calc(var(--sat) + 96px);transform:translateX(-50%);font-weight:700;font-size:26px;white-space:nowrap;color:var(--accent);pointer-events:none;animation:fly 1s forwards;z-index:9;letter-spacing:-.01em}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.res{text-align:center;padding:28px 16px 20px}.res .big{width:88px;height:88px;border-radius:28px;background:var(--tint);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin:0 auto 4px}.res .big .ic{width:44px;height:44px}.res .big.ko{background:var(--badbg);color:var(--bad)}.res h2{font-size:26px;margin:12px 0 4px}.res p{color:var(--ink2);margin:6px 0}
.res .gain{display:flex;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap}
.miss{text-align:left;margin-top:16px}.miss>div:not(.eyebrow){background:var(--card2);border-radius:12px;padding:12px;margin:8px 0;font-size:14px;line-height:1.45}.miss b{display:block;margin-bottom:2px}
/* statistiques et profil */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}.stat small{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}.stat span{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:center;gap:6px}.stat span .ic{width:20px;height:20px;color:var(--gold)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--card2);font-size:24px;line-height:1;margin:4px 6px 4px 0;filter:grayscale(1);opacity:.35}.badge.on{filter:none;opacity:1;background:var(--goldbg)}
.foot{margin-top:24px;text-align:center;font-size:13px;color:var(--ink2)}.foot button{color:var(--accent);font-weight:600;margin:0 6px}
/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-start;background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sab));z-index:5}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);min-width:64px;padding:4px 8px;border-radius:12px;transition:color .2s}.tabbar button.on{color:var(--accent)}.tabbar button b{display:block;width:26px;height:26px;line-height:0}.tabbar button b .ic{width:26px;height:26px}
.tabbar .dot{position:absolute;top:2px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card);box-sizing:content-box}
/* listes */
.list button,.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:13px 14px;background:var(--card);border-radius:14px;margin:8px 0;box-shadow:var(--sh);font-size:15.5px;font-weight:500;line-height:1.35}
.list button small,.lrow small{display:block;color:var(--ink2);font-size:12.5px;font-weight:400;margin-top:2px;line-height:1.35}.lrow>div{min-width:0;flex:1}.lrow .ic{width:18px;height:18px;color:var(--ink3)}
.list button>span{flex:1}.list button:after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);flex:none;margin-right:4px}
.hidden{display:none}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:10;pointer-events:none}
/* transitions d'écran, retours */
#app.in{animation:screen .25s cubic-bezier(.2,.8,.2,1)}
@keyframes screen{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt.ok{animation:popok .4s}.opt.ko{animation:shakeko .4s}
@keyframes popok{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeko{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:8;animation:flash .5s forwards}.flash.ok{background:radial-gradient(ellipse at 50% 35%,rgba(29,158,90,.18),transparent 65%)}.flash.ko{background:radial-gradient(ellipse at 50% 35%,rgba(224,70,76,.18),transparent 65%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:66}
#toasts{position:fixed;left:16px;right:16px;top:calc(10px + var(--sat));z-index:65;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:tin .3s}.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
.cele{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .25s}

   croissants et suivis d'un mot ; « la 6508 », « jusqu'à 1250 » ou « 10 et 8 » restent en ligne. */
const fmtList=(p,wrap)=>{const re=/(^|[.:;,]\s)<b>(\d{1,2})<\/b>\s(?=(?!et\b|ou\b)[A-Za-zÀ-ÿ'’«]{2,})/g;const ms=[...p.matchAll(re)].filter(m=>+m[2]<=40);
 if(ms.length<2||ms[0][2]>12)return null;for(let i=1;i<ms.length;i++)if(+ms[i][2]<=+ms[i-1][2])return null;
 const cut=m=>m.index+m[1].length;const lead=p.slice(0,cut(ms[0])).trim();
 const items=ms.map((m,i)=>p.slice(cut(m)+m[0].length-m[1].length,i+1<ms.length?cut(ms[i+1]):undefined).trim());
 const ol=`<ol class="nl">${items.map((t,i)=>`<li value="${ms[i][2]}">${t}</li>`).join('')}</ol>`;return wrap?wrap(lead,ol):(lead?`<p>${lead}</p>`:'')+ol};
/* Une suite de « <b>Terme</b> : définition. <b>Terme</b> : définition. » devient une liste de définitions,
   un terme par ligne, en titre : on retient un vocabulaire bien plus vite quand chaque mot a sa case.
   Le marqueur doit ouvrir un segment (début, <br>, ou fin de phrase), avec au plus trois mots devant. */
/* Une énumération « tête : a, b, c. » (au moins trois éléments courts, sans conjonction en tête d'élément)
   devient une liste à puces. Les phrases qui ne sont pas de vraies listes restent intactes. */
const ENUMSTOP=/^(mais|puis|donc|ou|pour|avec|sans|dans|sur|par|car|que|qui|en|à|au|aux|de|du|des|d'|l'|entre|plus|ouvert|soit|ensuite|enfin|alors|ainsi|et|ni|comme|si|sinon|sauf|voire|c'est)\b/i;
const topSplit=(s,sep)=>{const o=[];let d=0,last=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;else if(c===')')d--;else if(!d&&s.startsWith(sep,i)){o.push(s.slice(last,i));last=i+sep.length;i+=sep.length-1}}o.push(s.slice(last));return o};
const enumItems=t=>{t=t.trim().replace(/[.!?]+$/,'');if(/[.!?;]/.test(t.replace(/\([^)]*\)/g,'')))return null;let it=topSplit(t,', ');
 if(it.length>=2){const l=it[it.length-1],k=l.indexOf(' et ');if(k>0&&k<=32&&l.length-k-4<=32&&!/\(/.test(l.slice(0,k)))it.splice(it.length-1,1,l.slice(0,k),l.slice(k+4))}

const ulOf=it=>`<ul class="enum">${it.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const fmtEnum=h=>{const parts=h.match(/[^.!?]+(?:[.!?]+|$)/g);if(!parts)return null;let out='',buf='',any=false;
 parts.forEach(s=>{const k=s.indexOf(' : ');if(k>0){const head=s.slice(0,k),it=enumItems(s.slice(k+3));if(it&&head.replace(/<[^>]+>/g,'').trim().length<=80){any=true;if(buf.trim())out+=`<p>${buf.trim()}</p>`;buf='';out+=`<p class="lh">${head.trim()} :</p>`+ulOf(it);return}}buf+=s});
 if(!any)return null;if(buf.trim())out+=`<p>${buf.trim()}</p>`;return out};
const fmtDefs=p=>{const re=/(^|<br>|[.!?]\s)\s*((?:[^<.:;!?]{1,30}?\s)?)<b>((?:(?!<\/b>).){1,80}?)<\/b>\s*:\s*/g;const ms=[...p.matchAll(re)];if(ms.length<2)return null;

 const items=ms.map((m,i)=>{let d=p.slice(m.index+m[0].length,i+1<ms.length?cut(ms[i+1]):undefined).replace(/(<br>|\s)+$/,'').trim();const it=enumItems(d);return `<li><b>${(m[2]||'').trim()}${m[2]?' ':''}${m[3]}</b>${it?ulOf(it):'<span class="d">'+d+'</span>'}</li>`});

app.innerHTML=hud()+`<div class="card slide"><div class="eyebrow">Rappel libre ${i+1} / ${list.length} · chapitre ${x.li}</div><h2>${b.h}</h2><p style="color:var(--muted)">${l.t}</p>

 if(nd)return{id:'m-rev',e:'review',t:'Réviser',s:Math.min(nd,15)+' question'+(nd>1?'s':'')+' due'+(nd>1?'s':'')+(nd>15?' sur '+nd:'')+' · ~'+Math.max(2,Math.ceil(Math.min(nd,15)/3))+' min'};

 if(a.id!=='m-rev'&&nd)alt.push(['m-rev','Réviser ('+Math.min(nd,15)+')']);if(a.id!=='m-nx'&&nx)alt.push(['m-nx','Chapitre '+nx]);if(a.id!=='m-fr'&&fr)alt.push(['m-fr','Réciter']);if(a.id!=='m-mix'&&allQ().length)alt.push(['m-mix','Examen blanc']);

 return `<button class="cta${done?' done':''}" id="${a.id}"><div><div class="s">${done?'Objectif atteint · en bonus':'À faire maintenant'}</div><div class="t">${a.t}</div><div class="s">${a.s}</div></div><div class="e">${done?ic('check'):ic(a.e)}</div></button>${alt.length?`<div class="alts">${alt.map(x=>`<button class="btn ghost" id="${x[0]}">${x[1]}</button>`).join('')}</div>`:''}`}
function bindMission(){const b=(id,f)=>{const e=$(id);if(e)e.onclick=f};b('#m-rev',()=>session(dueQ().slice(0,15),'Révision du jour'));b('#m-fr',()=>recite(frDue().slice(0,5)));b('#m-nx',()=>{const li=nextChapter();if(li)level(li)});b('#m-mix',()=>session(shuffle(allQ()).slice(0,15),'Examen blanc'));b('#m-sc',()=>scenario());b('#m-cas',()=>etudeCas());
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('.ring .fg');if(f)f.style.strokeDashoffset=f.dataset.to}))}
// Rater trois fois la meme question, ce n'est plus un trou de memoire : on renvoie au briefing.
function fx(html){if(!html)return '';
const STOP=/^(Pour|Pas|Si|Le|La|Les|Un|Une|Des|Du|De|En|Et|Ou|Au|Aux|Ce|Cet|Il|On|Or|Par|Sur|Art|Hz|Nm|kN|MW|Wh|VA|AC|DC|kV|kW|kA|Ohm)$/;
const DSTOP=/^(en|pour|soit|avec|selon|où|donc|puis|et|ou|à|au|par|sur|dans|de|du|des|si|car|mais|que|qui|est|sont|vaut)$/i;
const sub=t=>t.replace(/(^|[\s(×·])([A-ZΔ])([a-z]{1,2}|Tr|[0-9])(?=$|[\s)×·,.;:=+−-])/g,(m,a,b,c)=>STOP.test(b+c)?m:a+b+'<sub>'+c+'</sub>');
const sup=t=>t.replace(/\^\(([^)]+)\)/g,'<sup>$1</sup>').replace(/\^([0-9A-Za-zαβ−-]+)/g,'<sup>$1</sup>');
function splitTop(s,re){const out=[];let d=0,last=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;else if(c===')')d--;else if(d===0){const m=s.slice(i).match(re);if(m&&m.index===0){out.push(s.slice(last,i));out.push(m[0]);i+=m[0].length-1;last=i+1}}}out.push(s.slice(last));return out}
function keepWs(s,f){const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);return m[1]+(m[2]?f(m[2]):'')+m[3]}
function term(s){return keepWs(s,t=>{
 let d=0,cut=-1;for(let i=0;i<t.length;i++){const c=t[i];if(c==='(')d++;else if(c===')')d--;else if(c==='/'&&d===0){cut=i;break}}
 if(cut<0)return expr(t);
 const a=t.slice(0,cut),b=t.slice(cut+1);
 const spaced=/\s$/.test(a)||/^\s/.test(b);
 if(!spaced&&/[A-Za-zµΩ²³]$/.test(a)&&/^[A-Za-zµΩ²³]/.test(b))return expr(a)+'/'+term(b); // unité km/h
 // dénominateur : jusqu'à un mot d'arrêt
 let den='',rest='';if(/^\s*\(/.test(b)){let dd=0,k=b.indexOf('(');for(;k<b.length;k++){if(b[k]==='(')dd++;else if(b[k]===')'){dd--;if(!dd)break}}den=b.slice(0,k+1);rest=b.slice(k+1)}
 else{const w=b.trim().split(/\s+/);let n=0;while(n<w.length&&!DSTOP.test(w[n])&&!/[,;.:]$/.test(w[n-1]||''))n++;if(!n)n=1;den=w.slice(0,n).join(' ');const pm=den.match(/[.,;:]+$/);if(pm){den=den.slice(0,-pm[0].length)}rest=b.trim().slice(den.length)}
 return '<span class="frac"><span>'+expr(a.trim())+'</span><span>'+term(den.trim())+'</span></span>'+(rest?term(rest):'')})}
function expr(s){let out='',i=0;while(i<s.length){const c=s[i];
 if(c==='√'){let j=i+1;if(s[j]==='('){let d=0,k=j;for(;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'){d--;if(!d)break}}out+='<span class="sqrt">√<span class="rad">'+formula(s.slice(j+1,k))+'</span></span>';i=k+1}else{const m=s.slice(j).match(/^[0-9A-Za-z,.]+/);out+='<span class="sqrt">√<span class="rad">'+(m?m[0]:'')+'</span></span>';i=j+(m?m[0].length:0)}continue}
 if(c==='('){let d=0,k=i;for(;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'){d--;if(!d)break}}out+='('+formula(s.slice(i+1,k))+')';i=k+1;continue}
 out+=c;i++}
 return sup(sub(out))}
function formula(s){return splitTop(s,/^\s[=≈]\s/).map((seg,k)=>k%2?seg:splitTop(seg,/^\s[+−]\s/).map((t,j)=>j%2?t:term(t)).join('')).join('')}
const SENT=/[^.;!?]+(?:[.;!?]+|$)/g;
return html.split(/(<[^>]+>)/).map((p,k)=>{if(k%2)return p;return p.replace(SENT,s=>/[=≈]/.test(s)||/[√^]|\d\/\d/.test(s)?formula(s):s)}).join('')}
function srcOf(x){if(x.q.src)return x.q.src;const l=L[x.li];if(!l||!l.b)return '';const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/<[^>]+>/g,' ');const words=[...new Set(norm(x.q.q+' '+(x.q.e||'')).split(/[^a-z0-9]+/).filter(w=>w.length>3))];let best=0,bs=-1;l.b.forEach((sl,i)=>{const t=norm(sl.h+' '+(sl.p||[]).join(' ')+' '+(sl.k||''));const s=words.reduce((n,w)=>n+(t.includes(w)?1:0),0);if(s>bs){bs=s;best=i}});return l.b[best].src||''}
function srcLine(x){const s=srcOf(x);return s?`<div class="src">Source : ${s}</div>`:''}
function why(x){const l=L[x.li];if(!l||!l.b||!l.b.length)return '';const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/<[^>]+>/g,' ');const words=[...new Set(norm(x.q.q+' '+(x.q.e||'')).split(/[^a-z0-9]+/).filter(w=>w.length>3))];let best=0,bs=-1;l.b.forEach((sl,i)=>{const t=norm(sl.h+' '+(sl.p||[]).join(' ')+' '+(sl.k||''));const s=words.reduce((n,w)=>n+(t.includes(w)?1:0),0);if(s>bs){bs=s;best=i}});const sl=l.b[best];return `<details class="why"><summary>${ic('book')}D'où ça vient ?</summary><div class="why-b"><div class="eyebrow">Chap. ${x.li} · ${l.t||''} · ${sl.h}</div>${(sl.p||[]).map(para).join('')}${sl.k?`<div class="tip">${fmtDefs(fx(sl.k))||fmtEnum(fx(sl.k))||fx(sl.k)}</div>`:''}${sl.src?`<div class="src">Source : ${sl.src}</div>`:''}<button class="btn ghost sm" data-why-li="${x.li}" data-why-idx="${best}">Ouvrir le briefing complet</button></div></details>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-why-li]');if(b)brief(+b.dataset.whyLi,+b.dataset.whyIdx,true)});
function leech(x){const r=S.sr[x.id];return r&&r.f>=3?`<div style="margin-top:8px"><button class="btn ghost sm" id="leech" data-li="${x.li}">${ic('book')}Ratée ${r.f} fois · relire le briefing</button></div>`:''}

tions à courant fort (directives ESTI 407, 244)</a><a class="lnk" target="_blank" rel="noopener" href="https://www.suva.ch/fr-ch">Suva, publications de prévention</a><a class="lnk" target="_blank" rel="noopener" href="https://www.ekas.ch/fr">CFST, directives 6508, 6512</a><a class="lnk" target="_blank" rel="noopener" href="https://www.netzelektriker.ch/fr">AES, examen professionnel de spécialiste de réseau</a></div></div>
<div class="card"><div class="eyebrow">Trophées</div>${BOSSES.map((b,i)=>`<span class="badge${S.boss[i]?' on':''}" title="${b[1]}">${b[0]}</span>`).join('')}<span class="badge${(S.streak.best||0)>=7?' on':''}">🔥</span><span class="badge${tot>=42?' on':''}">🌟</span><span class="badge${S.xp>=4200?' on':''}">🎓</span></div>
<div class="card"><div class="eyebrow">Chapitres</div>${[...Array(14)].map((_,i)=>{const li=i+1,d=S.done[li],qs=L[li].q.length,w=all.filter(x=>x.li===li&&x.r&&x.r.f>0&&x.r.n<3).length;return `<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)"><span>${li}. ${L[li].t}</span><span class="mono">${d?stars(d.st)+' '+(d.pct!=null?d.pct+'%':d.best+'/'+(d.tot||qs)):'—'}${w?' <span class="warn">'+w+' fragile'+(w>1?'s':'')+'</span>':''}</span></div>`}).join('')}</div>
<div class="card"><div class="eyebrow">Réglages</div>
<div class="row"><span>Objectif quotidien</span><div class="seg">${[10,20,30].map(g=>`<button class="${(S.goal||20)===g?'on':''}" data-goal="${g}">${g}</button>`).join('')}</div></div>
<label class="row"><span>Sons</span><input type="checkbox" id="sfx" ${S.sfx?'checked':''}></label>
<label class="row"><span>Vibrations</span><input type="checkbox" id="hapt" ${S.hap?'checked':''}></label>
<div class="row"><span>Gels de série · <b>${S.freeze||0}</b> / 2</span><button class="btn ghost sm" id="buyfrz" ${(S.freeze||0)>=2||S.coins<50?'disabled':''}>Acheter · 50 pièces</button></div>
<p style="color:var(--muted);font-size:12.5px;margin:8px 0 0">Un gel protège ta série un jour sans jouer. Il s'utilise tout seul. Le coffre du jour peut aussi en offrir un.</p></div>
${BRIDGE?`<div class="card"><div class="eyebrow">Rappel quotidien</div><p style="color:var(--muted);font-size:14px;margin:0 0 10px">Une notification par jour, à l'heure que tu choisis, tant qu'il te reste des questions à réviser.</p>
<label class="row"><span>Activer</span><input type="checkbox" id="non" ${S.notif.on?'checked':''}></label>
<label class="row"><span>Heure</span><input type="time" id="nheure" class="field" style="width:auto;font-size:16px;padding:8px 12px" value="${String(S.notif.h).padStart(2,'0')}:${String(S.notif.m).padStart(2,'0')}"></label>
<p id="nfb" style="font-size:13px;color:var(--ok);margin:10px 0 0;min-height:18px"></p></div>`
:`<div class="tip"><b>Installer sur l'iPhone :</b> dans Safari, touche Partager puis « Sur l'écran d'accueil ». Le jeu s'ouvre plein écran et marche hors ligne.</div>`}
<div class="foot"><button id="exp">Exporter la progression</button><button id="imp">Importer</button><button id="reset">Réinitialiser</button></div>`;
if(BRIDGE){pushRappels();const fb=$('#nfb');const maj=()=>{save();pushRappels();fb.textContent=S.notif.on?'Rappel réglé à '+String(S.notif.h).padStart(2,'0')+'h'+String(S.notif.m).padStart(2,'0')+'.':'Rappels désactivés.'};
$('#non').onchange=e=>{S.notif.on=e.target.checked;maj()};
$('#nheure').onchange=e=>{const v=(e.target.value||'19:30').split(':');S.notif.h=+v[0];S.notif.m=+v[1];maj()}}
app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();profile()});$('#sfx').onchange=e=>{S.sfx=e.target.checked;save();if(S.sfx)SFX.ok()};$('#hapt').onchange=e=>{S.hap=e.target.checked;save();hap('ok')};$('#buyfrz').onclick=()=>{if(S.coins<50||(S.freeze||0)>=2)return;S.coins-=50;S.freeze=(S.freeze||0)+1;SFX.coin();toast('Gel acheté. Tu en as '+S.freeze+'.');save();profile()};
$('#exp').onclick=()=>{const txt=JSON.stringify(Object.assign({jeu:SKEY,exp:Date.now()},S));if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
 let ta=$('#expta');if(!ta){ta=document.createElement('textarea');ta.id='expta';ta.readOnly=true;ta.style.cssText='width:100%;height:110px;margin-top:8px;font:12px ui-monospace,Menlo,monospace;background:var(--field);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px';$('#exp').parentNode.appendChild(ta)}ta.value=txt;ta.focus();ta.select();
 alert('Sauvegarde copiée dans le presse-papiers. Colle-la dans une note. Elle apparaît aussi sous le bouton.')};
$('#imp').onclick=()=>{const v=prompt('Colle ta sauvegarde :');if(!v)return;let o;try{o=JSON.parse(v)}catch(e){alert('Sauvegarde illisible.');return}
 if(!o||typeof o!=='object'||!o.sr||(o.jeu&&o.jeu!==SKEY)){alert('Cette sauvegarde ne vient pas de '+document.title+'.');return}
 if(!confirm('Remplacer ta progression actuelle par cette sauvegarde ?'))return;delete o.jeu;delete o.exp;S=fusion(S,o);save();location.reload()};
$('#reset').onclick=()=>{if(confirm('Tout effacer ? XP, étoiles, mémoire de révision.')){localStorage.removeItem(SKEY);location.reload()}};const cb=$('#classe');if(cb)cb.onclick=()=>classe()}
/* ===================== DÉMARRAGE ===================== */
newDay();bienvenue();home();pushRappels();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
