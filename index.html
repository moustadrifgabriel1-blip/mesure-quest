<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mesure Quest</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesure Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0B1220;--panel:#131C2E;--panel2:#1A2540;--line:#26334F;--ink:#E6EDF7;--muted:#8A98B4;--amber:#FFB347;--amber2:#FFD08A;--cyan:#4FD1E8;--ok:#5BD98A;--bad:#FF6B6B;--lock:#3A4762;--w:#4FD1E8;
--fd:"Chakra Petch",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;overscroll-behavior:none}
body{background-image:radial-gradient(ellipse at 50% -20%,#1b2a4a 0%,transparent 60%);min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.15;text-wrap:balance}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:calc(10px + var(--sat)) 14px calc(84px + var(--sab))}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.top .brand{font-family:var(--fd);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);font-size:12px;line-height:1.1;white-space:nowrap}
.top .brand small{display:block;font:400 10px var(--fb);letter-spacing:.12em;color:var(--muted)}
.xp{flex:1;min-width:0}.xp .lbl{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.xp .bar{height:7px;background:#0a0f1a;border:1px solid var(--line);border-radius:4px;overflow:hidden}.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .5s}
.pill{font-family:var(--fm);font-size:12px;background:#0a0f1a;border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:nowrap;color:var(--amber2)}
.pill.fire{color:#ff9f43;border-color:#5a3a14}
.hero{margin:6px 0 18px}.hero h1{font-size:28px}.hero h1 b{color:var(--amber)}.hero p{color:var(--muted);margin:6px 0 0;font-size:15px}
.world{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin:10px 0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--w);border-radius:12px;transition:transform .15s}
.world:active:not(:disabled){transform:scale(.98)}.world:disabled{opacity:.45;filter:grayscale(.6)}
.world .e{font-size:34px;text-align:center}.world .t{font-family:var(--fd);font-size:18px;font-weight:700}.world .s{font-size:13px;color:var(--muted)}.world .num{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--w)}
.world .st{font-family:var(--fm);font-size:13px;color:var(--amber2);text-align:right}.world .st small{display:block;color:var(--muted);font-size:10px}
.path{position:relative;padding-left:30px;margin-top:6px}.path:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:3px;background:repeating-linear-gradient(180deg,var(--w) 0 8px,transparent 8px 14px);opacity:.5}
.node{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.node:before{content:"";position:absolute;left:-25px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--line);transform:translateY(-50%)}
.node.done:before{background:var(--w);border-color:var(--w);box-shadow:0 0 12px var(--w)}.node.cur:before{border-color:var(--amber);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,179,71,.6)}50%{box-shadow:0 0 0 7px rgba(255,179,71,0)}}
.node:disabled{opacity:.5}.node .t{font-family:var(--fd);font-weight:700;font-size:16px}.node .s{font-size:13px;color:var(--muted)}.node .num{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w)}
.node.boss{border-color:#5a2a2a;background:linear-gradient(135deg,#2a1520,var(--panel))}.node.boss .num{color:var(--bad)}
.stars{font-family:var(--fm);color:var(--amber);letter-spacing:2px;font-size:15px}.stars.off{color:var(--lock)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
.card h2{font-size:22px;margin-bottom:8px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-family:var(--fd);margin-bottom:6px}
.slide p{margin:8px 0;font-size:15.5px}
.key{border-left:3px solid var(--amber);background:rgba(255,179,71,.07);padding:10px 14px;margin:14px 0;border-radius:0 6px 6px 0}.key b{color:var(--amber2)}
.fig{margin:12px 0;background:#0a0f1a;border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}.fig svg{display:block;width:100%;height:auto;max-height:230px}
.lab{display:grid;gap:12px}.lab label{display:grid;grid-template-columns:1fr;gap:4px;font-size:13px;color:var(--muted)}.lab label .mono{color:var(--amber2);font-size:14px}
.lab input[type=range]{accent-color:var(--amber);width:100%}.lab select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.read div{background:#0a0f1a;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.read small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.read span{font:600 17px var(--fm);color:var(--amber2)}.warn{color:var(--bad)!important;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.btn{font-family:var(--fd);font-weight:700;letter-spacing:.04em;background:var(--amber);color:#1a1200;border-radius:10px;padding:12px 18px;font-size:15px;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.cy{background:var(--cyan);color:#001a20}.btn.red{background:var(--bad);color:#fff}.btn.wide{width:100%;display:block;text-align:center}.btn:disabled{opacity:.4}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--amber)}
/* combat */
.arena{background:linear-gradient(180deg,#0a0f1a,var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.foe{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}.foe .e{font-size:40px;text-align:center;transition:transform .15s}.foe.hit .e{animation:shake .4s}.foe.dead .e{opacity:.2;transform:rotate(90deg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.foe .n{font-family:var(--fd);font-weight:700;font-size:15px}.foe .n small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.hp{height:12px;background:#0a0f1a;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ff9f43);transition:width .4s}
.hp.boss i{background:linear-gradient(90deg,#c084fc,#ff6b6b)}
.me{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}.hearts{font-size:18px;letter-spacing:2px}.hearts .lost{opacity:.25}
.combo{color:var(--amber);font-family:var(--fd);font-weight:700}
.timer{height:5px;background:#0a0f1a;border-radius:3px;overflow:hidden;margin:8px 0 0}.timer i{display:block;height:100%;background:var(--bad);transition:width 1s linear}
.q{font-size:17px;font-weight:600;margin:6px 0 12px;line-height:1.4}
.opts{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;transition:transform .1s}
.opt:active:not(:disabled){transform:scale(.98)}.opt .k{font-family:var(--fm);color:var(--muted);font-size:12px;min-width:16px}.opt .n{font-family:var(--fm);color:var(--amber);min-width:16px}
.opt.sel{border-color:var(--cyan)}.opt.ok{border-color:var(--ok);background:rgba(91,217,138,.12)}.opt.ko{border-color:var(--bad);background:rgba(255,107,107,.12)}.opt.paired{opacity:.4}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match .opt{font-size:13px;padding:10px}
.numin{display:flex;gap:8px;align-items:center}.numin input{flex:1;font:600 18px var(--fm);background:#0a0f1a;color:var(--amber2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}.numin .u{color:var(--muted);font-family:var(--fm)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);font-size:14.5px;animation:pop .25s}.fb.ok{background:rgba(91,217,138,.1);border-color:rgba(91,217,138,.3)}
.why{margin-top:8px;font-size:14px}.why summary{cursor:pointer;color:var(--cy,#4fd1e8);font-family:var(--fd);list-style:none;padding:6px 0}.why summary::-webkit-details-marker{display:none}.why-b{margin-top:6px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--tx,inherit)}.why-b p{margin:6px 0;line-height:1.5}.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}.frac>span{padding:1px 5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}.frac>span:first-child{border-bottom:1.5px solid currentColor}.sqrt{white-space:nowrap}.sqrt .rad{border-top:1.5px solid currentColor;padding:1px 2px 0 1px;margin-left:1px}sub,sup{font-size:.72em}.fb b{display:block;color:var(--bad);margin-bottom:3px;font-family:var(--fd)}.fb.ok b{color:var(--ok)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.dmg{position:fixed;left:50%;top:30%;transform:translateX(-50%);font:700 40px var(--fd);color:var(--amber);pointer-events:none;animation:fly 1s forwards;z-index:9;text-shadow:0 2px 12px #000}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.res{text-align:center;padding:24px 14px}.res .big{font-size:64px;line-height:1}.res h2{font-size:26px;margin:10px 0 4px}.res .stars{font-size:32px;letter-spacing:6px;margin:8px 0}.res p{color:var(--muted);margin:6px 0}
.res .gain{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.miss{text-align:left;margin-top:14px}.miss div{background:#0a0f1a;border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;font-size:13.5px}.miss b{color:var(--amber2);display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0a0f1a;border:1px solid var(--line);border-radius:10px;padding:12px}.stat small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.stat span{font:600 22px var(--fm);color:var(--amber2)}
.badge{display:inline-block;font-size:26px;margin:4px;filter:grayscale(1);opacity:.35}.badge.on{filter:none;opacity:1}
.foot{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}.foot button{color:var(--cyan);text-decoration:underline;margin:0 6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(11,18,32,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(8px + var(--sab));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:70px;font-family:var(--fd)}.tabbar button.on{color:var(--amber)}.tabbar button b{font-size:22px;line-height:1}
.tabbar .dot{position:absolute;margin-left:28px;margin-top:-2px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tip{background:rgba(79,209,232,.08);border:1px solid rgba(79,209,232,.3);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.tip b{color:var(--cyan)}
.list button{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0}.list button small{display:block;color:var(--muted);font-size:12px}
.hidden{display:none}
@media(max-width:420px){.top .brand small{display:none}.xp .lbl span:last-child{display:none}}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabs"></nav>
<script type="text/plain" id="moteur">
/* ===================== ÉTAT ===================== */
const $=s=>document.querySelector(s),app=$('#app');
const TOTALQ=[...Array(14)].reduce((a,_,i)=>a+L[i+1].q.length,0);
const NCH=L.length-1;const TOTETOILES=NCH*3;
const RANKS=[[0,'Apprenti'],[300,'Aide-monteur'],[800,'Monteur de réseau'],[1600,'Chef d\'équipe'],[2800,'Spécialiste de réseau'],[4200,'Maître mesureur'],[6000,'Légende du candélabre']];
const FOES=['👾','🦇','🐙','🤖','👻','🐍','🦂','🧟','🦖','🕷️','🐉','🧌','🦑','👹'];
const BOSSES=[['🧙','Le Métrologue fou'],['⚡','Le Gardien de la cabine'],['🌩️','Le Seigneur du court-circuit'],['🐍','L\'Hydre des câbles'],['👑','Le Roi Candélabre']];
const FOENAMES=['Parasite','Ohm noir','Glitch','Déphaseur','Court-jus','Saturator','Wattvore','Boucleur','Harmonix','Fuiteur','Tore-tordu','Câblofurax','Fantôme du sol','Candélabre'];
let S={xp:0,coins:0,done:{},boss:{},sr:{},fr:{},streak:{last:'',n:0},day:{d:'',n:0},free:false,pot:0,notif:{on:true,h:19,m:30}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('mq2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('mq2',JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
/* Pont vers l'app iOS native. Absent dans Safari et dans la PWA : tout le code appelant doit rester inoffensif sans lui. */
const BRIDGE=(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.rappels)||null;
window.bilanRappels=(n,quand)=>{const fb=document.querySelector('#nfb');if(!fb)return;
if(quand==='refus'){fb.style.color='var(--bad)';fb.textContent='Notifications refusées. Autorise-les dans Réglages > Mesure Quest.';return}
if(quand==='desactive'){fb.style.color='var(--muted)';fb.textContent='Rappels désactivés.';return}
const d=new Date(quand);fb.style.color='var(--ok)';
fb.textContent=n+' rappels programmés. Le prochain '+d.toLocaleString('fr-CH',{weekday:'long',hour:'2-digit',minute:'2-digit'})+'.'};
function pushRappels(){if(!BRIDGE)return;try{BRIDGE.postMessage({on:!!S.notif.on,hour:S.notif.h,minute:S.notif.m,due:dueQ().length,streak:S.streak.n,jamaisVues:Math.max(0,TOTALQ-Object.keys(S.sr).length)})}catch(e){}}
const dayN=d=>Math.floor(new Date(d).getTime()/864e5);
const rank=()=>{let r=RANKS[0];for(const x of RANKS)if(S.xp>=x[0])r=x;const i=RANKS.indexOf(r),nx=RANKS[i+1];return{name:r[1],pct:nx?Math.min(100,(S.xp-r[0])/(nx[0]-r[0])*100):100,nx}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const fmt=v=>(''+v).replace('.',',').replace('-','−');
const wOf=li=>W.findIndex(w=>w.l.includes(li));
const wDone=w=>W[w].l.every(li=>S.done[li]);
const wOpen=w=>S.free||w===0||S.boss[w-1];
const lvlOpen=li=>{const w=wOf(li),k=W[w].l.indexOf(li);return S.free||(wOpen(w)&&(k===0||S.done[W[w].l[k-1]]))};
function touchStreak(){const t=today();if(S.streak.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t;if(S.day.d!==t)S.day={d:t,n:0};save()}
/* ===================== RÉPÉTITION ESPACÉE (SM-2 allégé) ===================== */
const qid=(li,k)=>li+'-'+k;
function srUpdate(id,ok){const r=S.sr[id]||{n:0,ef:2.5,iv:0,due:0,f:0};const t=dayN(today());
if(ok){r.n++;r.iv=r.n===1?1:r.n===2?3:Math.round(r.iv*r.ef);r.ef=Math.min(3,r.ef+.1)}else{r.n=0;r.iv=0;r.ef=Math.max(1.3,r.ef-.25);r.f=(r.f||0)+1}
r.due=t+r.iv;S.sr[id]=r}
function allQ(){const o=[];for(let li=1;li<=14;li++)if(S.free||S.done[li])L[li].q.forEach((q,k)=>o.push({li,k,q,id:qid(li,k),r:S.sr[qid(li,k)]}));return o}
function dueQ(){const t=dayN(today());return allQ().filter(x=>x.r&&x.r.due<=t).sort((a,b)=>a.r.due-b.r.due)}
/* ===================== NAVIGATION ===================== */
let tab='map';const TABS=[['map','🗺️','Mondes'],['train','🧠','Réviser'],['codex','📖','Codex'],['me','🏅','Profil']];
function tabs(){const nd=dueQ().length;$('#tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}${t[0]==='train'&&nd?'<i class="dot"></i>':''}</button>`).join('');
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;window.scrollTo(0,0);({map:home,train:train,codex:codex,me:profile})[tab]()})}
function hud(){const r=rank();return `<div class="top"><div class="brand">Mesure Quest<small>AE07 · Mesure</small></div><div class="xp"><div class="lbl"><span>${r.name}</span><span>${r.nx?r.nx[0]-S.xp+' XP → '+r.nx[1]:'Rang max'}</span></div><div class="bar"><i style="width:${r.pct}%"></i></div></div><span class="pill">🪙 ${S.coins}</span><span class="pill fire">🔥 ${S.streak.n}</span></div>`}
/* ===================== CARTE DES MONDES ===================== */
function home(){tab='map';tabs();const tot=Object.values(S.done).reduce((a,b)=>a+b.st,0),nd=dueQ().length;
app.innerHTML=hud()+`<div class="hero"><h1>Cinq <b>mondes</b>, cinq <b>boss</b>, un cours à dompter.</h1><p>Chaque niveau : un briefing avec labo, puis un combat. Bats le boss d'un monde pour ouvrir le suivant.</p></div>`
+mission()
+W.map((w,i)=>{const op=wOpen(i),st=w.l.reduce((a,li)=>a+(S.done[li]?S.done[li].st:0),0);return `<button class="world" style="--w:${w.c}" ${op?'':'disabled'} data-w="${i}"><div class="e">${op?w.e:'🔒'}</div><div><div class="num">Monde ${i+1}</div><div class="t">${w.n}</div><div class="s">${op?w.d:'Bats le boss du monde '+i+' pour ouvrir.'}</div></div><div class="st">${st} / ${w.l.length*3} ★<small>${S.boss[i]?'boss vaincu':'boss en vie'}</small></div></button>`}).join('')
+`<div class="foot">${tot} / 42 étoiles · <button id="free">${S.free?'Verrouiller':'Tout débloquer'}</button></div>`;
app.querySelectorAll('.world').forEach(b=>b.onclick=()=>world(+b.dataset.w));$('#free').onclick=()=>{S.free=!S.free;save();home()};bindMission()}
function world(w){tabs();const ww=W[w],all=wDone(w);

if(q.t==='match'){const draw=()=>{$('#mt').innerHTML=st.l.map((y,k)=>`<button class="opt${st.sel===y?' sel':''}${st.pairs[y]?' paired':''}" data-s="l" data-v="${k}">${y}</button><button class="opt${Object.values(st.pairs).includes(st.r[k])?' paired':''}" data-s="r" data-v="${k}">${st.r[k]}</button>`).join('');app.querySelectorAll('#mt .opt').forEach(b=>b.onclick=()=>{const v=b.dataset.s==='l'?st.l[+b.dataset.v]:st.r[+b.dataset.v];if(b.dataset.s==='l'){if(st.pairs[v])return;st.sel=v;draw()}else if(st.sel){if(Object.values(st.pairs).includes(v))return;st.pairs[st.sel]=v;st.sel=null;if(Object.keys(st.pairs).length===q.p.length){const ok=q.p.every(p=>st.pairs[p[0]]===p[1]);draw();answer(ok,ok?'':'Paires : '+q.p.map(p=>p[0]+' → '+p[1]).join(' · '))}else draw()}})};draw()}};
const done=()=>{const n=res.filter(Boolean).length,pct=Math.round(n/list.length*100);S.coins+=n;save();
pushRappels();app.innerHTML=hud()+`<div class="card res"><div class="big">${pct>=80?'🧠':pct>=50?'📈':'🔁'}</div><h2>${title}</h2><p>${n} / ${list.length} · ${pct} %</p><div class="gain"><span class="pill">+${xp} XP</span><span class="pill">+${n} 🪙</span></div>${miss.length?`<div class="miss"><div class="eyebrow">À revoir demain</div>${miss.map(x=>`<div><b>${fx(x.q.q)}</b>${fx(x.q.e)}</div>`).join('')}</div>`:'<p>Sans faute. Les intervalles s\'allongent.</p>'}<div class="nav" style="justify-content:center"><button class="btn" id="ok">Retour</button></div></div>`;$('#ok').onclick=train};show()}

/* ===================== RAPPEL LIBRE ===================== */
// Briefings a reciter : chapitres deja joues, jamais recites ou dont l'echeance est passee.
function frDue(){const t=dayN(today()),o=[];for(let li=1;li<=NCH;li++){if(!(S.free||S.done[li]))continue;L[li].b.forEach((b,idx)=>{const r=S.fr[li+'.'+idx];if(!r||r.due<=t)o.push({li,idx,r})})}return shuffle(o.filter(x=>!x.r)).concat(o.filter(x=>x.r).sort((a,b)=>a.r.due-b.r.due))}
// On dit ce qu'on sait AVANT de relire : la recherche en memoire sans indice ancre plus
// profondement que la reconnaissance d'un QCM. Auto-evaluation honnete, puis espacement.
function recite(list){if(!list.length){train();return}touchStreak();tabs();let i=0;const res=[];
const show=()=>{const x=list[i],l=L[x.li],b=l.b[x.idx];
app.innerHTML=hud()+`<div class="card slide"><div class="eyebrow">Rappel libre ${i+1} / ${list.length} · chapitre ${x.li}</div><h2>${b.h}</h2><p style="color:var(--muted)">${l.t}</p>
<div class="tip"><b>Ferme les yeux.</b> Dis à voix haute, ou écris sur un papier, tout ce que tu sais sur ce point : définitions, chiffres, formules, ordre des étapes. Prends trente secondes. Ensuite seulement, révèle.</div>
<div id="rev"><button class="btn wide" id="show">👁️ Révéler le briefing</button></div>
<div class="nav"><button class="btn ghost" id="quit" style="font-size:13px;padding:8px 12px">✕ Arrêter</button></div></div>`;
$('#quit').onclick=train;
$('#show').onclick=()=>{$('#rev').innerHTML=b.p.map(p=>`<p>${p}</p>`).join('')+(b.k?`<div class="key">${b.k}</div>`:'')+`<div class="eyebrow" style="margin-top:14px">Honnêtement, tu avais l'essentiel ?</div><div class="nav" style="justify-content:space-between"><button class="btn ghost" id="no">🔁 Non, à revoir</button><button class="btn" id="yes">✅ Oui, je savais</button></div>`;
const grade=ok=>{const key=x.li+'.'+x.idx,t=dayN(today()),r=S.fr[key]||{n:0,iv:0,due:0};if(ok){r.n++;r.iv=r.n===1?2:r.n===2?5:Math.round(r.iv*2.2);S.xp+=8}else{r.n=0;r.iv=1}r.due=t+r.iv;S.fr[key]=r;res.push(ok);save();i++;i<list.length?show():done()};
$('#no').onclick=()=>grade(false);$('#yes').onclick=()=>grade(true);$('#rev').scrollIntoView({block:'start',behavior:'smooth'})}};
const done=()=>{const n=res.filter(Boolean).length;app.innerHTML=hud()+`<div class="card res"><div class="big">${n===res.length?'🧠':'📈'}</div><h2>Rappel libre</h2><p>${n} / ${res.length} briefings sus. +${n*8} XP</p><p style="color:var(--muted);font-size:14px">Ceux que tu ne savais pas reviennent demain. Les autres s'espacent.</p><div class="nav" style="justify-content:center"><button class="btn" id="ok">Retour</button></div></div>`;$('#ok').onclick=train};show()}

/* ===================== MISSION DU JOUR ET RELECTURE ===================== */
// La regularite predit la reussite plus que tout le reste : un seul ecran dit quoi faire aujourd'hui.
function nextChapter(){for(let li=1;li<=NCH;li++)if(!S.done[li]&&lvlOpen(li))return li;return 0}
function mission(){const nd=dueQ().length,fr=frDue().length,nx=nextChapter(),today_n=S.day.d===today()?S.day.n:0;
 const items=[];
 if(nd)items.push(`<button class="btn wide cy" id="m-rev">🧠 Réviser ${Math.min(nd,15)} question${nd>1?'s':''} dues${nd>15?' sur '+nd:''}</button>`);
 if(fr)items.push(`<button class="btn wide ghost" id="m-fr">🗣️ Réciter un briefing</button>`);
 if(nx)items.push(`<button class="btn wide ghost" id="m-nx">⚔️ Nouveau chapitre : ${nx}. ${L[nx].t}</button>`);
 
 const done=!nd&&!fr&&!nx;
 return `<div class="card"><div class="eyebrow">🎯 Mission du jour · ${today_n} réponse${today_n>1?'s':''} déjà</div><p style="color:var(--muted);font-size:14px;margin:6px 0 10px">${done?'Tout est à jour. Un examen blanc, ou une étude de cas, et c\'est gagné pour aujourd\'hui.':'Dans l\'ordre, quinze minutes suffisent. Ce qui est dû passe avant ce qui est nouveau.'}</p>${items.join('<div style="height:6px"></div>')}</div>`}
function bindMission(){const b=(id,f)=>{const e=$(id);if(e)e.onclick=f};b('#m-rev',()=>session(dueQ().slice(0,15),'Révision du jour'));b('#m-fr',()=>recite(frDue().slice(0,5)));b('#m-nx',()=>{const li=nextChapter();if(li)level(li)});b('#m-sc',()=>scenario());b('#m-cas',()=>etudeCas())}
// Rater trois fois la meme question, ce n'est plus un trou de memoire : on renvoie au briefing.
function fx(html){if(!html)return '';
const STOP=/^(Pour|Pas|Si|Le|La|Les|Un|Une|Des|Du|De|En|Et|Ou|Au|Aux|Ce|Cet|Il|On|Or|Par|Sur|Art|Hz|Nm|kN|MW|Wh|VA|AC|DC|kV|kW|kA|Ohm)$/;
const DSTOP=/^(en|pour|soit|avec|selon|où|donc|puis|et|ou|à|au|par|sur|dans|de|du|des|si|car|mais|que|qui|est|sont|vaut)$/i;
const sub=t=>t.replace(/(^|[\s(×·])([A-ZΔ])([a-z]{1,2}|Tr|[0-9])(?=$|[\s)×·,.;:=+−-])/g,(m,a,b,c)=>STOP.test(b+c)?m:a+b+'<sub>'+c+'</sub>');
const sup=t=>t.replace(/\^\(([^)]+)\)/g,'<sup>$1</sup>').replace(/\^([0-9A-Za-zαβ−-]+)/g,'<sup>$1</sup>');
function splitTop(s,re){const out=[];let d=0,last=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;else if(c===')')d--;else if(d===0){const m=s.slice(i).match(re);if(m&&m.index===0){out.push(s.slice(last,i));out.push(m[0]);i+=m[0].length-1;last=i+1}}}out.push(s.slice(last));return out}
function keepWs(s,f){const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);return m[1]+(m[2]?f(m[2]):'')+m[3]}
function term(s){return keepWs(s,t=>{
 let d=0,cut=-1;for(let i=0;i<t.length;i++){const c=t[i];if(c==='(')d++;else if(c===')')d--;else if(c==='/'&&d===0){cut=i;break}}
 if(cut<0)return expr(t);
 const a=t.slice(0,cut),b=t.slice(cut+1);
 const spaced=/\s$/.test(a)||/^\s/.test(b);
 if(!spaced&&/[A-Za-zµΩ²³]$/.test(a)&&/^[A-Za-zµΩ²³]/.test(b))return expr(a)+'/'+term(b); // unité km/h
 // dénominateur : jusqu'à un mot d'arrêt
 let den='',rest='';if(/^\s*\(/.test(b)){let dd=0,k=b.indexOf('(');for(;k<b.length;k++){if(b[k]==='(')dd++;else if(b[k]===')'){dd--;if(!dd)break}}den=b.slice(0,k+1);rest=b.slice(k+1)}
 else{const w=b.trim().split(/\s+/);let n=0;while(n<w.length&&!DSTOP.test(w[n])&&!/[,;.:]$/.test(w[n-1]||''))n++;if(!n)n=1;den=w.slice(0,n).join(' ');const pm=den.match(/[.,;:]+$/);if(pm){den=den.slice(0,-pm[0].length)}rest=b.trim().slice(den.length)}
 return '<span class="frac"><span>'+expr(a.trim())+'</span><span>'+term(den.trim())+'</span></span>'+(rest?term(rest):'')})}
function expr(s){let out='',i=0;while(i<s.length){const c=s[i];
 if(c==='√'){let j=i+1;if(s[j]==='('){let d=0,k=j;for(;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'){d--;if(!d)break}}out+='<span class="sqrt">√<span class="rad">'+formula(s.slice(j+1,k))+'</span></span>';i=k+1}else{const m=s.slice(j).match(/^[0-9A-Za-z,.]+/);out+='<span class="sqrt">√<span class="rad">'+(m?m[0]:'')+'</span></span>';i=j+(m?m[0].length:0)}continue}
 if(c==='('){let d=0,k=i;for(;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'){d--;if(!d)break}}out+='('+formula(s.slice(i+1,k))+')';i=k+1;continue}
 out+=c;i++}
 return sup(sub(out))}
function formula(s){return splitTop(s,/^\s[=≈]\s/).map((seg,k)=>k%2?seg:splitTop(seg,/^\s[+−]\s/).map((t,j)=>j%2?t:term(t)).join('')).join('')}
const SENT=/[^.;!?]+(?:[.;!?]+|$)/g;
return html.split(/(<[^>]+>)/).map((p,k)=>{if(k%2)return p;return p.replace(SENT,s=>/[=≈]/.test(s)||/[√^]|\d\/\d/.test(s)?formula(s):s)}).join('')}
function why(x){const l=L[x.li];if(!l||!l.b||!l.b.length)return '';const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/<[^>]+>/g,' ');const words=[...new Set(norm(x.q.q+' '+(x.q.e||'')).split(/[^a-z0-9]+/).filter(w=>w.length>3))];let best=0,bs=-1;l.b.forEach((sl,i)=>{const t=norm(sl.h+' '+(sl.p||[]).join(' ')+' '+(sl.k||''));const s=words.reduce((n,w)=>n+(t.includes(w)?1:0),0);if(s>bs){bs=s;best=i}});const sl=l.b[best];return `<details class="why"><summary>📖 D'où ça vient ? Voir le cours</summary><div class="why-b"><div class="eyebrow">Chap. ${x.li} · ${l.t||''} · ${sl.h}</div>${(sl.p||[]).map(p=>`<p>${fx(p)}</p>`).join('')}${sl.k?`<div class="tip">${fx(sl.k)}</div>`:''}<button class="btn ghost" data-why-li="${x.li}" data-why-idx="${best}" style="font-size:13px;padding:8px 12px">Ouvrir le briefing complet</button></div></details>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-why-li]');if(b)brief(+b.dataset.whyLi,+b.dataset.whyIdx,true)});
function leech(x){const r=S.sr[x.id];return r&&r.f>=3?`<div style="margin-top:8px"><button class="btn ghost" id="leech" data-li="${x.li}" style="font-size:13px;padding:8px 12px">📖 Ratée ${r.f} fois : relire le briefing du chapitre ${x.li}</button></div>`:''}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#leech');if(b)brief(+b.dataset.li,0,true)});
/* ===================== CODEX ===================== */
function codex(){tab='codex';tabs();app.innerHTML=hud()+`<div class="hero"><h1>📖 <b>Codex</b></h1><p>Tous les briefings et labos des chapitres ouverts, à relire à tout moment. Ferme les yeux et récite avant de rouvrir.</p></div><div class="list">`
+W.map((w,wi)=>`<div class="eyebrow" style="color:${w.c};margin-top:14px">Monde ${wi+1} · ${w.n}</div>`+w.l.map(li=>{const op=S.free||lvlOpen(li);return `<button ${op?'':'disabled'} data-l="${li}" style="${op?'':'opacity:.4'}">${L[li].t}<small>${L[li].b.map(b=>b.h).join(' · ')}</small></button>`}).join('')).join('')+'</div>';
app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>brief(+b.dataset.l,0,true))}
/* ===================== PROFIL ===================== */
function profile(){tab='me';tabs();const r=rank(),tot=Object.values(S.done).reduce((a,b)=>a+b.st,0),all=allQ(),seen=Object.keys(S.sr).length;
const stand=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
app.innerHTML=hud()+`<div class="hero"><h1>🏅 <b>${r.name}</b></h1><p>${S.xp} XP · ${tot} / 42 étoiles · série de ${S.streak.n} jour${S.streak.n>1?'s':''}</p></div>
<div class="grid2"><div class="stat"><small>Questions vues</small><span>${seen} / ${TOTALQ}</span></div><div class="stat"><small>Maîtrisées</small><span style="color:var(--ok)">${all.filter(x=>x.r&&x.r.iv>=21).length}</span></div><div class="stat"><small>Pièces</small><span>🪙 ${S.coins}</span></div><div class="stat"><small>Boss vaincus</small><span>${Object.keys(S.boss).length} / 5</span></div></div>
<div class="card"><div class="eyebrow">👥 Ma classe</div><p style="color:var(--muted);font-size:14px;margin:6px 0 10px">${S.classe&&S.classe.code?`Classe <b class="mono" style="letter-spacing:2px">${S.classe.code}</b>, pseudo <b>${S.classe.pseudo}</b>.`:`Rejoins tes camarades avec un code à six lettres et comparez votre progression.`}</p><button class="btn wide ghost" id="classe">${S.classe&&S.classe.code?`Voir le classement`:`Rejoindre ou créer une classe`}</button></div>
<div class="card"><div class="eyebrow">Trophées</div>${BOSSES.map((b,i)=>`<span class="badge${S.boss[i]?' on':''}" title="${b[1]}">${b[0]}</span>`).join('')}<span class="badge${S.streak.n>=7?' on':''}">🔥</span><span class="badge${tot>=42?' on':''}">🌟</span><span class="badge${S.xp>=4200?' on':''}">🎓</span></div>
<div class="card"><div class="eyebrow">Chapitres</div>${[...Array(14)].map((_,i)=>{const li=i+1,d=S.done[li],qs=L[li].q.length,w=all.filter(x=>x.li===li&&x.r&&x.r.f>0&&x.r.n<3).length;return `<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)"><span>${li}. ${L[li].t}</span><span class="mono">${d?stars(d.st)+' '+(d.pct!=null?d.pct+'%':d.best+'/'+(d.tot||qs)):'—'}${w?' <span class="warn">'+w+' fragile'+(w>1?'s':'')+'</span>':''}</span></div>`}).join('')}</div>
${BRIDGE?`<div class="card"><div class="eyebrow">🔔 Rappel quotidien</div><p style="color:var(--muted);font-size:14px;margin:0 0 10px">Une notification par jour, à l'heure que tu choisis, tant qu'il te reste des questions à réviser.</p>
<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px"><span>Activer</span><input type="checkbox" id="non" ${S.notif.on?'checked':''} style="width:24px;height:24px;accent-color:var(--amber)"></label>
<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;margin-top:12px"><span>Heure</span><input type="time" id="nheure" value="${String(S.notif.h).padStart(2,'0')}:${String(S.notif.m).padStart(2,'0')}" style="font:600 17px var(--fm);background:#0a0f1a;color:var(--amber2);border:1px solid var(--line);border-radius:8px;padding:8px 12px"></label>
<p id="nfb" style="font-size:13px;color:var(--ok);margin:10px 0 0;min-height:18px"></p></div>`
:`<div class="tip">📱 <b>Installer sur l'iPhone :</b> dans Safari, touche Partager puis « Sur l'écran d'accueil ». Le jeu s'ouvre plein écran et marche hors ligne.</div>`}
<div class="foot"><button id="exp">Exporter la progression</button><button id="imp">Importer</button><button id="reset">Réinitialiser</button></div>`;
if(BRIDGE){pushRappels();const fb=$('#nfb');const maj=()=>{save();pushRappels();fb.textContent=S.notif.on?'Rappel réglé à '+String(S.notif.h).padStart(2,'0')+'h'+String(S.notif.m).padStart(2,'0')+'.':'Rappels désactivés.'};
$('#non').onchange=e=>{S.notif.on=e.target.checked;maj()};
$('#nheure').onchange=e=>{const v=(e.target.value||'19:30').split(':');S.notif.h=+v[0];S.notif.m=+v[1];maj()}}
$('#exp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(S));prompt('Copie ce texte pour le sauvegarder :',JSON.stringify(S))};
$('#imp').onclick=()=>{const v=prompt('Colle ta sauvegarde :');if(!v)return;try{S=Object.assign(S,JSON.parse(v));save();profile()}catch(e){alert('Sauvegarde illisible.')}};
$('#reset').onclick=()=>{if(confirm('Tout effacer ? XP, étoiles, mémoire de révision.')){localStorage.removeItem('mq2');location.reload()}};const cb=$('#classe');if(cb)cb.onclick=()=>classe()}
/* ===================== DÉMARRAGE ===================== */
touchStreak();home();pushRappels();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="acces.js"></script>
